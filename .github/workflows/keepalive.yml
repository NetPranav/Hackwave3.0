# Keep the free Render engine awake: Render stops a free web service after 15 min without inbound requests, and the
# first request then waits ~1 min for it to start (long enough for a GitHub webhook to time out). This pings /health
# every 10 minutes. The URL is the repository variable SEISMO_ENGINE_URL (set by `npm run deploy:render`); without it
# the job does nothing. Scheduled runs only run on the default branch, and GitHub may delay them by a few minutes.
name: keep engine awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping /health
        env:
          URL: ${{ vars.SEISMO_ENGINE_URL }}
        run: |
          if [ -z "$URL" ]; then echo "SEISMO_ENGINE_URL not set: nothing to ping"; exit 0; fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL/health" || true)
            echo "attempt $i: $code"; [ "$code" = "200" ] && exit 0; sleep 10
          done
          exit 1
