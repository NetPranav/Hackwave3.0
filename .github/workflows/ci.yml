name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, netpranav, adarzhpathade, overxpowered]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-rules:
    name: pr-rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|test|chore|perf|ci|build|release)(\([a-z0-9-]+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(dashboard): dashboard v1'."
            exit 1
          fi
          echo "Title OK."

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relative Markdown links resolve
        run: bash scripts/check-md-links.sh
      - name: Shell scripts parse
        run: for f in scripts/*.sh scripts/admin/*.sh .githooks/*; do bash -n "$f"; done
      - name: Claude settings are valid JSON
        run: jq empty .claude/settings.json

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          dirs=""
          for d in backend services; do
            if [ -f "$d/pyproject.toml" ] || [ -f "$d/requirements.txt" ]; then dirs="$dirs $d"; fi
          done
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Python projects:${dirs:- none yet}"
      - if: steps.detect.outputs.dirs != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.detect.outputs.dirs != ''
        name: Lint and test
        run: |
          python -m pip install -q --upgrade pip ruff pytest
          for d in ${{ steps.detect.outputs.dirs }}; do
            echo "::group::$d"
            (
              cd "$d"
              if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi
              if [ -f pyproject.toml ]; then pip install -q -e ".[dev]" || pip install -q -e .; fi
              ruff check .
              pytest -q || test $? -eq 5   # exit code 5 = no tests collected yet
            )
            echo "::endgroup::"
          done

  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine workspaces (contracts, sdk-node, backend, github-app, services) via Turbo
        run: |
          if [ ! -f package.json ]; then echo "No root package.json yet"; exit 0; fi
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx eslint .
          npx turbo run typecheck test build
      - name: Dashboard (own package, own lockfile; owned by adarzhpathade)
        run: |
          [ -f dashboard/package.json ] || { echo "No dashboard yet"; exit 0; }
          cd dashboard
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present

  ci-ok:
    name: ci-ok
    if: always()
    needs: [pr-rules, docs, python, node]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          for r in "${{ needs.pr-rules.result }}" "${{ needs.docs.result }}" "${{ needs.python.result }}" "${{ needs.node.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$r'."; exit 1 ;;
            esac
          done
          echo "CI OK"
